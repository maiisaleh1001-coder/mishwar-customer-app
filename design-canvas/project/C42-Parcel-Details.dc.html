<!doctype html>
<html lang="ar">
<head>

<x-dc>
<helmet>

</helmet>
<div dir="rtl" style="width: 390px; height: 1000px; box-sizing: border-box; padding: 47px 0 40px; background: #FBFBFB; color: #1B2B2B; font-family: 'Inter', 'IBM Plex Sans Arabic', system-ui, sans-serif; display: flex; flex-direction: column">
  <div style="height: 56px; display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; padding: 0 16px">
    <button type="button" aria-label="رجوع" style="width: 40px; height: 40px; border: none; border-radius: 999px; background: #E9F4F3; color: #1B2B2B; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="10" stroke-width="1.5" d="M14.43 5.93L20.5 12l-6.07 6.07M3.5 12h16.83"/></svg></button>
    <span style="text-align: center; font-size: 16px; font-weight: 500">توصيل طرد</span>
    <span></span>
  </div>
  <div style="flex: 1; display: flex; flex-direction: column; gap: 20px; padding: 8px 24px 0">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <div role="img" aria-label="الخطوة 2 من 3" style="display: flex; gap: 6px"><span style="flex: 1; height: 4px; border-radius: 2px; background: #0F6E6E"></span><span style="flex: 1; height: 4px; border-radius: 2px; background: #0F6E6E"></span><span style="flex: 1; height: 4px; border-radius: 2px; background: #E9F4F3"></span></div>
      <span style="font-size: 12px; line-height: 20px; color: #5B6766">الخطوة 2 من 3 · المستلم والطرد</span>
    </div>

    <section style="display: flex; flex-direction: column; gap: 12px">
      <h2 style="margin: 0; font-size: 20px; line-height: 28px; font-weight: 700">مين بيستلم الطرد؟</h2>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="rc-name" style="font-size: 14px; line-height: 16px; font-weight: 500">اسم المستلم</label>
        <input id="rc-name" value="نورة السبيعي" style="height: 56px; box-sizing: border-box; border: 2px solid transparent; border-radius: 8px; background: #FFFFFF; padding: 0 14px; font: inherit; font-size: 16px; color: #1B2B2B; outline: none">
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="rc-phone" style="font-size: 14px; line-height: 16px; font-weight: 500">جوال المستلم</label>
        <div dir="ltr" style="height: 56px; box-sizing: border-box; border: 2px solid transparent; border-radius: 8px; background: #FFFFFF; display: flex; align-items: center">
          <span style="display: flex; align-items: center; gap: 8px; padding: 0 12px; height: 60%; border-right: 1px solid rgba(0, 0, 0, 0.14); font-size: 16px; font-weight: 500; flex: none"><svg width="24" height="16" viewBox="0 0 24 16" role="img" aria-label="السعودية"><rect width="24" height="16" rx="3" fill="#006C35"/><rect x="6" y="4" width="12" height="2" rx="1" fill="#FFFFFF" opacity=".85"/><rect x="5" y="9" width="14" height="2" rx="1" fill="#FFFFFF"/></svg>+966</span>
          <input id="rc-phone" inputmode="numeric" value="55 432 1098" style="flex: 1; min-width: 0; height: 100%; border: none; outline: none; background: transparent; font: inherit; font-size: 16px; padding: 0 12px; color: #1B2B2B">
        </div>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 12px">
      <h2 style="margin: 0; font-size: 20px; line-height: 28px; font-weight: 700">وش بترسل؟</h2>
      <span style="font-size: 14px; line-height: 16px; font-weight: 500">نوع الطرد</span>
      <div role="radiogroup" aria-label="نوع الطرد" style="display: flex; flex-wrap: wrap; gap: 8px">
        <button type="button" role="radio" aria-checked="false" style="height: 40px; padding: 0 16px; border: 1.5px solid transparent; border-radius: 999px; background: #E9F4F3; color: #1B2B2B; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer">مستندات</button>
        <button type="button" role="radio" aria-checked="true" style="height: 40px; padding: 0 16px; border: 1.5px solid #0F6E6E; border-radius: 999px; background: #0F6E6E; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer">صغير</button>
        <button type="button" role="radio" aria-checked="false" style="height: 40px; padding: 0 16px; border: 1.5px solid transparent; border-radius: 999px; background: #E9F4F3; color: #1B2B2B; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer">متوسط</button>
        <button type="button" role="radio" aria-checked="false" style="height: 40px; padding: 0 16px; border: 1.5px solid transparent; border-radius: 999px; background: #E9F4F3; color: #1B2B2B; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer">كبير</button>
      </div>
      <span style="font-size: 14px; line-height: 16px; font-weight: 500">الوزن التقريبي</span>
      <div role="radiogroup" aria-label="الوزن التقريبي" style="display: flex; flex-wrap: wrap; gap: 8px">
        <button type="button" role="radio" aria-checked="false" style="height: 40px; padding: 0 16px; border: 1.5px solid transparent; border-radius: 999px; background: #E9F4F3; color: #1B2B2B; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer">أقل من 1 كجم</button>
        <button type="button" role="radio" aria-checked="true" style="height: 40px; padding: 0 16px; border: 1.5px solid #0F6E6E; border-radius: 999px; background: #0F6E6E; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer">1 – 5 كجم</button>
        <button type="button" role="radio" aria-checked="false" style="height: 40px; padding: 0 16px; border: 1.5px solid transparent; border-radius: 999px; background: #E9F4F3; color: #1B2B2B; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer">5 – 10 كجم</button>
        <button type="button" role="radio" aria-checked="false" style="height: 40px; padding: 0 16px; border: 1.5px solid transparent; border-radius: 999px; background: #E9F4F3; color: #1B2B2B; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer">10 – 20 كجم</button>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="pc-notes" style="font-size: 14px; line-height: 16px; font-weight: 500">ملاحظات للمندوب <span style="font-weight: 400; color: #5B6766">(اختياري)</span></label>
        <textarea id="pc-notes" rows="3" placeholder="مثلاً: الطرد قابل للكسر، سلّمه للحارس" style="box-sizing: border-box; border: 2px solid transparent; border-radius: 8px; background: #FFFFFF; padding: 12px 14px; font: inherit; font-size: 16px; line-height: 24px; color: #1B2B2B; outline: none; resize: none"></textarea>
      </div>
      <button type="button" style="align-self: flex-start; border: none; background: none; padding: 0; font: inherit; font-size: 14px; font-weight: 500; color: #0F6E6E; display: inline-flex; align-items: center; gap: 6px; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M12 7.75V13M21.08 8.58v6.84c0 1.12-.6 2.16-1.570 2.73l-5.94 3.43c-.97.56-2.17.56-3.15 0l-5.94-3.43a3.15 3.15 0 0 1-1.57-2.73V8.58c0-1.12.6-2.16 1.57-2.73l5.94-3.43c.97-.56 2.17-.56 3.15 0l5.94 3.43c.97.57 1.57 1.6 1.57 2.73Z" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 16.2v.1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span style="text-decoration: underline; text-underline-offset: 3px">الأشياء الممنوع توصيلها</span></button>
    </section>
  </div>
  <div style="padding: 12px 24px 0">
    <button type="button" style="height: 56px; width: 100%; border: none; border-radius: 999px; background: #0F6E6E; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 500; cursor: pointer">التالي</button>
  </div>
</div>
