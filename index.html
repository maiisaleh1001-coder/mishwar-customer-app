<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مشوار · النموذج التفاعلي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap">
<style>
/* صفحة عرض واحدة للبروتوتايبين: تبديل فوق، الجوال في النص، والوصف جنبه */
:root{--bg:#0B3434;--bg2:#0F4141;--ink:#F3F1EA;--mute:#A9C2BF;--sand:#E2A23B;--line:rgba(243,241,234,.14);--chip:rgba(243,241,234,.08)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;background:var(--bg);color:var(--ink);overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 92% 8%,rgba(226,162,59,.10),transparent 38%),radial-gradient(circle at 8% 100%,rgba(15,110,110,.35),transparent 45%)}
.wrap{position:relative;min-height:100%;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:56px;padding:88px max(24px,env(safe-area-inset-left)) 24px max(24px,env(safe-area-inset-right))}
.switch{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:5;display:flex;gap:4px;padding:5px;border-radius:999px;background:rgba(11,52,52,.85);border:1px solid var(--line);backdrop-filter:blur(8px)}
.switch button{height:40px;padding:0 18px;border:none;border-radius:999px;background:none;color:var(--mute);font:inherit;font-size:14px;font-weight:500;display:flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap}
.switch button::before{content:"";width:7px;height:7px;border-radius:999px;background:currentColor;opacity:.6}
.switch button[aria-selected="true"]{background:var(--ink);color:#0B3434}
.switch button[aria-selected="true"]::before{background:var(--sand);opacity:1}
.switch button:focus-visible{outline:2px solid var(--sand);outline-offset:2px}
.stage{grid-column:2;width:440px;height:min(920px,calc(100vh - 112px));position:relative}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent}
.stage iframe[hidden]{display:none}
.info{grid-column:1;grid-row:1;justify-self:end;max-width:460px;display:flex;flex-direction:column;gap:20px}
.brand{display:flex;align-items:center;gap:14px}
.brand .mark{width:56px;height:56px;border-radius:999px;background:var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.brand h1{font-size:44px;line-height:1.1;font-weight:700;letter-spacing:0}
.tag{font-size:20px;line-height:1.5;color:var(--sand);font-weight:500}
.lead{font-size:16px;line-height:1.9;color:var(--mute);text-wrap:pretty}
.lead b{color:var(--sand);font-weight:500}
.pts{list-style:none;padding:0;display:flex;flex-direction:column;gap:12px}
.pts li{display:flex;gap:12px;font-size:14px;line-height:1.7;color:var(--ink)}
.pts li::before{content:"";width:8px;height:8px;border-radius:999px;background:var(--sand);flex:none;margin-top:8px}
.try{padding:12px 14px;border-radius:14px;background:var(--chip);border:1px solid var(--line);font-size:13px;line-height:1.7;color:var(--mute)}
.try b{color:var(--ink);font-weight:500}
.meta{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--mute)}
.meta button{height:36px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:none;color:var(--ink);font:inherit;font-size:13px;cursor:pointer}
.meta button:hover{background:var(--chip)}
@media (max-width:1100px){
  .wrap{grid-template-columns:minmax(0,1fr);gap:28px;padding-top:76px;justify-items:center}
  .stage{grid-column:1;grid-row:1;width:min(440px,100%);height:min(920px,calc(100svh - 92px))}
  .info{grid-column:1;grid-row:2;justify-self:center;max-width:560px;padding-bottom:24px}
  .brand h1{font-size:34px}
}
@media (prefers-reduced-motion:no-preference){.switch button{transition:background .2s,color .2s}}
</style>
</head>
<body>
<div class="switch" role="tablist" aria-label="اختر التطبيق">
  <button type="button" role="tab" id="t-customer" aria-selected="true" aria-controls="f-customer" data-app="customer">تطبيق العميل</button>
  <button type="button" role="tab" id="t-provider" aria-selected="false" aria-controls="f-provider" data-app="provider">تطبيق مقدم الخدمة</button>
</div>
<main class="wrap">
  <div class="stage">
    <iframe id="f-customer" title="نموذج تطبيق العميل" data-src="ui/index.html?embed=1"></iframe>
    <iframe id="f-provider" title="نموذج تطبيق مقدم الخدمة" data-src="ui/provider.html?embed=1" hidden></iframe>
  </div>
  <section class="info" aria-live="polite">
    <div class="brand">
      <span class="mark"><svg width="32" height="32" viewBox="0 0 40 40" fill="none" aria-hidden="true"><path d="M20 4c-6.6 0-12 5.2-12 11.7C8 24.5 20 36 20 36s12-11.5 12-20.3C32 9.2 26.6 4 20 4z" fill="#0F6E6E"/><path d="M15 16h10m-4-4 4 4-4 4" stroke="#F3F1EA" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <h1>مشوار</h1>
    </div>
    <p class="tag">مشاويرك كلها في تطبيق واحد.</p>
    <p class="lead" id="lead"></p>
    <ul class="pts" id="pts"></ul>
    <p class="try" id="try"></p>
    <div class="meta"><span id="meta"></span><button type="button" id="restart">ابدأ من الأول</button></div>
  </section>
</main>
<script>
const APPS={
  customer:{
    lead:'<b>تطبيق العميل</b> يبدأ من الخدمة اللي تحتاجها: رحلة، طرد، مرافق شخصي، أو معاملة حكومية. تحدد طلبك وتشوف السعر قبل ما تأكد، وتتابعه لحظة بلحظة لين يخلص.',
    pts:['أربع خدمات من رئيسية وحدة، وكل خدمة لها خطوات تناسبها.','السعر يبان قبل التأكيد، والفاتورة توصلك بعد كل طلب.','تتابع مقدم الخدمة على الخريطة وتكلّمه من داخل التطبيق.'],
    try:'للتجربة: اكتب <b>أي رقم جوال يبدأ بـ 5</b>، والرمز <b>1234</b>. أول دخول يوريك حساب عنده طلبات جارية.',
    meta:'تطبيق العميل · نموذج تفاعلي'
  },
  provider:{
    lead:'<b>تطبيق مقدم الخدمة</b> يبدأ من التسجيل واختيار الخدمات ورفع المستندات. وبعد اعتماد الحساب يستقبل الطلبات وينفّذها خطوة بخطوة لين يستلم أرباحه.',
    pts:['تفعيل الحساب في خطوات واضحة، وكل خطوة تتعلّم لما تكتمل.','عروض الطلبات بعدّاد واضح، ولو وصل أكثر من طلب يجون في قائمة وحدة.','الأرباح والمحفظة والسحب للحساب البنكي في مكان واحد.'],
    try:'للتجربة: امشِ بالأزرار زي التطبيق الحقيقي. بعد ما ترسل طلب التفعيل يوريك كل حالات الحساب لين يتعتمد.',
    meta:'تطبيق مقدم الخدمة · نموذج تفاعلي'
  }
};
const $=s=>document.querySelector(s);
function frame(app){const f=$('#f-'+app);if(!f.src)f.src=f.dataset.src;return f;}
function show(app,push){
  if(!APPS[app])app='customer';
  document.querySelectorAll('.switch button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.app===app)));
  document.querySelectorAll('.stage iframe').forEach(f=>{f.hidden=f.id!=='f-'+app;});
  frame(app);
  const a=APPS[app];$('#lead').innerHTML=a.lead;$('#pts').innerHTML=a.pts.map(p=>`<li>${p}</li>`).join('');$('#try').innerHTML=a.try;$('#meta').textContent=a.meta;
  document.title=(app==='provider'?'مشوار · تطبيق مقدم الخدمة':'مشوار · تطبيق العميل');
  if(push)history.replaceState(null,'','#'+app);
}
document.querySelector('.switch').addEventListener('click',e=>{const b=e.target.closest('button');if(b)show(b.dataset.app,true);});
document.querySelector('.switch').addEventListener('keydown',e=>{if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;const bs=[...document.querySelectorAll('.switch button')],i=bs.findIndex(b=>b.getAttribute('aria-selected')==='true'),n=bs[(i+1)%2];n.focus();show(n.dataset.app,true);});
$('#restart').addEventListener('click',()=>{const f=document.querySelector('.stage iframe:not([hidden])');f.src=f.dataset.src.split('#')[0]+'&r='+Date.now();});
// رابط قديم فيه رقم شاشة (#C-10 أو #P-30) يفتح على التطبيق بتاعه
const h=location.hash.slice(1);
if(/^C-/.test(h)){$('#f-customer').dataset.src='ui/index.html?embed=1#'+h;show('customer');}
else if(/^P-/.test(h)){$('#f-provider').dataset.src='ui/provider.html?embed=1#'+h;show('provider');}
else show(h==='provider'?'provider':'customer');
// نحمّل التطبيق التاني بعد الأول عشان التبديل يبقى فوري
addEventListener('load',()=>setTimeout(()=>{frame('customer');frame('provider');},1200));
</script>
</body>
</html>
